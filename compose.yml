# The database behind the Live Collections demo. Everything else in this
# repo runs without it, but the app supervises the Repo unconditionally, so
# Postgres must be up before `mix phx.server`.
#
#     docker compose up -d
#
# Port 5433 on purpose: it stays out of the way of a system Postgres on 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: dstar_demo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dstar_demo_dev
    ports:
      - "5433:5432"
    volumes:
      - dstar_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dstar_demo_pgdata:
